name: Release

# Push a tag like v1.0.0 to build and publish a release. Installed copies of
# Blanky find it through the releases.<channel>.json files and update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ github.ref_name }}
      deltas: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Blanky-win-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: "*"
          generate_release_notes: true
