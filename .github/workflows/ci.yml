name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Blanky.slnx -c Release -p:Platform=x64 -nologo

      - name: Test
        timeout-minutes: 5
        run: |
          dotnet build tests/Blanky.Core.Tests -c Release -nologo
          ./tests/Blanky.Core.Tests/bin/Release/net10.0/Blanky.Core.Tests.exe

  publish:
    uses: ./.github/workflows/publish.yml

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
