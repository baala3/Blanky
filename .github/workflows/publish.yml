name: Publish

# Builds the self-contained Native AOT app zips. Called by CI on every push, so an
# AOT break shows up before release day, and by the release workflow on tags.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp, e.g. 1.2.0 or v1.2.0. Defaults to the one in Directory.Build.props."
        type: string
        default: ""
      name:
        description: "Zip name suffix, e.g. v1.2.0."
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    # Each architecture builds and smoke-tests on its own hardware.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            runner: windows-latest
          - platform: ARM64
            rid: win-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".TrimStart("v")
          $extra = @()
          if ($version) { $extra += "-p:Version=$version" }
          dotnet publish src/Blanky/Blanky.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} @extra -o publish -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($required in "Blanky.exe", "Blanky.pri", "Assets/sounds.json") {
            if (-not (Test-Path "publish/$required")) { throw "$required missing from publish output" }
          }

      - name: Smoke test
        shell: pwsh
        run: scripts/smoke-test.ps1 -Exe publish/Blanky.exe

      - name: Zip
        shell: pwsh
        run: |
          # Symbols ship separately; users don't need them.
          New-Item -ItemType Directory symbols | Out-Null
          Move-Item publish/*.pdb symbols/
          Compress-Archive -Path publish/* -DestinationPath "Blanky-${{ inputs.name }}-${{ matrix.rid }}.zip"
          $size = (Get-Item "Blanky-${{ inputs.name }}-${{ matrix.rid }}.zip").Length / 1MB
          "Zip size: {0:N1} MB" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: Blanky-${{ matrix.rid }}
          path: Blanky-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.rid }}
          path: symbols/
          if-no-files-found: error
